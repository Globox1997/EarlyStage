plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/" }
    maven { url = "https://maven.blamejared.com/" }
	maven { url = "https://api.modrinth.com/maven" }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    compileOnly localRuntime("com.terraformersmc:modmenu:${project.mod_menu_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    compileOnly "mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}"
    localRuntime "mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}"
	compileOnly ("maven.modrinth:fallingtree:${project.fallingtree_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
	compileOnly ("maven.modrinth:dehydration:${project.dehydration_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
}

processResources {
	def expandProps = [
		"version": project.version,
		"fabric_version": project.fabric_version,
		"loader_version": project.loader_version,
		"minecraft_version": project.minecraft_version,
		"cloth_config_version": project.cloth_config_version,
		"java_version": project.java_version
	]
	inputs.properties(expandProps)

	filesMatching("fabric.mod.json") {
		expand expandProps
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = Integer.parseInt(project.java_version)
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(project.java_version))
	withSourcesJar()
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}
